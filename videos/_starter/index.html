<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    
    <script src="gsap.min.js"></script>
    <style>
@font-face{font-family:"Be Vietnam Pro";font-weight:600;src:url(fonts/be-vietnam-pro-vietnamese-600-normal.woff2) format("woff2");}
@font-face{font-family:"Be Vietnam Pro";font-weight:600;src:url(fonts/be-vietnam-pro-latin-600-normal.woff2) format("woff2");}
@font-face{font-family:"Be Vietnam Pro";font-weight:900;src:url(fonts/be-vietnam-pro-vietnamese-900-normal.woff2) format("woff2");}
@font-face{font-family:"Be Vietnam Pro";font-weight:900;src:url(fonts/be-vietnam-pro-latin-900-normal.woff2) format("woff2");}

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#0b0b0f; }
      #root { width:100%; height:100%; position:relative; font-family:"Be Vietnam Pro", sans-serif; color:#fff; }
      .line { position:absolute; left:80px; right:80px; text-align:center; }
      #l1 { top:620px; font-size:84px; font-weight:900; line-height:1.15; }
      #l1 span { color:#c6ff3d; }
      #l2 { top:1000px; font-size:56px; font-weight:600; color:#d4d4d8; }
      #big { top:1180px; font-size:220px; font-weight:900; color:#c6ff3d; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <h1 id="l1" class="line clip" data-start="0" data-duration="6" data-track-index="0">Bạn nghĩ <span>cả phòng gym</span> đang nhìn bạn?</h1>
      <p id="l2" class="line clip" data-start="0" data-duration="6" data-track-index="1">Thực tế người ta để ý chỉ khoảng</p>
      <p id="big" class="line clip" data-start="0" data-duration="6" data-track-index="2">~25%</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#l1", { opacity:0, y:60, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.6, ease:"back.out(1.7)" }, 0.2);
      tl.fromTo("#l2", { opacity:0 }, { opacity:1, duration:0.4 }, 2.0);
      tl.fromTo("#big", { opacity:0, scale:2.5 }, { opacity:1, scale:1, duration:0.5, ease:"power3.out" }, 2.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
